<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>赛博断舍离</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="header">
      <div>
        <h1>赛博断舍离</h1>
        <p>删除操作不可恢复！</p>
      </div>
      <span class="status" id="status">Ready</span>
    </header>

    <section class="warning">
      点击开始，批量删贴，随时停止。
    </section>

    <div class="actions">
      <button id="start" class="btn btn-start" type="button">开始</button>
      <button id="stop" class="btn btn-stop" type="button">停止</button>
    </div>

    <footer class="footer">
      此插件不收集数据，只在当前微博页面运行。
    </footer>

    <script src="popup.js"></script>
  </main>
</body>
</html>
